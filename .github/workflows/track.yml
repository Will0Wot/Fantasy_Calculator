# Every morning: fetch last night's play-by-play for the possession simulator, simulate every NBA game
# left this season for the per-game projections (data/possession/), record the model's predictions before
# the day's games and fill in results for finished weeks (tracking/<season>/*.csv), refresh the Discord
# bot's data and post the weekly preview when a fantasy week starts (discord-bot/data/), then commit it
# all so the app and the bot stay up to date. See tradecalc/sim/possession/, tradecalc/tracking.py and
# tradecalc/discord_bot.py.
name: Season tracker

on:
  schedule:
    - cron: "17 13 * * *"     # 13:17 UTC = 9:17 AM Eastern (8:17 in winter), before any tip-off
  workflow_dispatch:           # "Run workflow" button in the Actions tab
    inputs:
      discord_post_now:
        description: "Post this week's Discord preview now (even if it already went out)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [".github/workflows/track.yml"]

permissions:
  contents: write

concurrency:
  group: season-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore data cache (box scores and play-by-play already downloaded)
        uses: actions/cache@v4
        with:
          path: |
            tradecalc/data/cache.sqlite
            tradecalc/data/pbp
          key: tradecalc-data-${{ github.run_id }}
          restore-keys: tradecalc-data-

      - name: Update play-by-play and simulate the rest of the season
        run: python -m tradecalc.cli possession

      - name: Record predictions and results
        run: python -m tradecalc.cli track

      # The Discord bot's data, and at the start of each fantasy week the preview post (needs the
      # DISCORD_WEBHOOK_URL repository secret; skipped without it). A failed post never blocks the
      # commit below, and is retried the next morning.
      - name: Discord bot data and weekly post
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m tradecalc.cli discord --post ${{ inputs.discord_post_now && '--force' || '' }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracking/ tradecalc/data/possession/ discord-bot/data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Season tracker: predictions and results $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
